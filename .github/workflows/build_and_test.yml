name: Ubuntu, Mac, Windows
on:
  push:
  workflow_dispatch:
    secrets:
      GITHUBPYTEST_ACCT_TOKEN:
        required: true
jobs:
  build_and_test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ "ubuntu-latest", "macos-latest", "windows-latest"]
    secrets: inherit
    uses: AndrewOfC/githubpy/.github/workflows/build_and_test_core.yml@master
    with:
      runs-on: ${{ matrix.os }}
      python-version: ${{ matrix.python-version}}

